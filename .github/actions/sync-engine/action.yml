name: 'Sync Engine'
description: 'Core logic for project board synchronization'
inputs:
  backfill:
    description: 'Backfill window for open items: 30d-style or all (empty = normal run). Sync sets all when Catch up is ticked.'
    required: false
    default: ''
  verbose:
    description: 'Enable verbose logging'
    required: false
    default: 'true'
  github_token:
    description: 'GitHub Token'
    required: true

runs:
  using: 'node24'
  main: '../../../dist/index.js'
