name: Release Rebuilder

on:
  release:
    types: [published]

concurrency:
  group: release-dist-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  dist:
    name: Rebuild dist on release tag
    if: github.repository == 'bcgov/project-automator' && github.event.release.draft == false
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.unpublish.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Unpublish tag until dist is rebuilt
        id: unpublish
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "release tag is empty" >&2
            exit 1
          fi
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "ignoring release published by github-actions[bot]"
            exit 0
          fi
          subject=$(git log -1 --format=%s)
          if [ "$subject" = "chore(dist): rebuild ncc bundles for release" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag ${TAG} already points at the dist rebuild"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/release-base-sha"
          gh release view "$TAG" --json name,body,isPrerelease > "$RUNNER_TEMP/release.json"
          gh release delete "$TAG" --yes --cleanup-tag

      - uses: actions/setup-node@v7
        if: steps.unpublish.outputs.skip != 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Rebuild ncc bundles and republish tag
        if: steps.unpublish.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          base=$(cat "$RUNNER_TEMP/release-base-sha")
          title=$(jq -r '.name // empty' "$RUNNER_TEMP/release.json")
          jq -r '.body // empty' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/release-notes.md"
          prerelease=$(jq -r '.isPrerelease' "$RUNNER_TEMP/release.json")
          if [ -z "$title" ]; then
            title="$TAG"
          fi
          npm ci
          npm run build
          if [ ! -f dist/index.js ]; then
            echo "dist/index.js is missing after the build" >&2
            exit 1
          fi
          # dist/ is git-ignored on main, so it is force-added to the release commit
          git add -f -A -- dist
          if git diff --cached --ignore-space-at-eol --quiet -- dist; then
            git tag "$TAG" "$base"
          else
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -m "chore(dist): rebuild ncc bundles for release"
            git tag "$TAG"
          fi
          # The tag is pushed here, so it exists while the release is still a draft
          git push origin "refs/tags/${TAG}"
          # Draft until the smoke test passes; the publish job publishes it and moves the major tag
          flags=(--draft --verify-tag)
          if [ "$prerelease" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"

  smoke:
    name: Smoke test the release tag
    needs: dist
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The tag as consumers get it: committed dist/, no npm install, no build
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Check the tag commit carries dist/
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch dist/index.js >/dev/null 2>&1; then
            echo "tag ${TAG} has no committed dist/index.js" >&2
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          echo "Smoke testing ${TAG} at ${sha}"
          echo "Consumers pin \`bcgov/project-automator@${sha} # ${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the action from the tag (dry run)
        uses: ./
        with:
          github_token: ${{ secrets.PROJECT_SYNC_TOKEN }}
          config_path: rules.yml
          dry_run: 'true'

      - name: Report the failed gate
        if: failure()
        env:
          TAG: ${{ github.event.release.tag_name }}
          SKIP: ${{ needs.dist.outputs.skip }}
        run: |
          if [ "$SKIP" = "true" ]; then
            msg="Smoke test failed for ${TAG}. The rebuild was skipped, so the release was not changed."
          else
            msg="Smoke test failed for ${TAG}. The release stays a draft and the major tag was not moved. Fix and re-release, or delete the draft release and the ${TAG} tag."
          fi
          echo "::error::${msg}"
          echo "### :x: ${msg}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish the release
    needs: [dist, smoke]
    if: needs.dist.outputs.skip == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Publish the draft and move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
            echo "release ${TAG} is not a draft; refusing to republish it" >&2
            exit 1
          fi
          prerelease=$(gh release view "$TAG" --json isPrerelease -q .isPrerelease)
          gh release edit "$TAG" --draft=false
          echo "Published ${TAG} after the smoke test passed" >> "$GITHUB_STEP_SUMMARY"
          # Update floating major tag (e.g. v1 for v1.x.x)
          major="${TAG%%.*}"
          if [ "$prerelease" != "true" ] && [[ "$major" =~ ^v[0-9]+$ ]]; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git tag -fa "$major" -m "Release $TAG"
            git push origin "refs/tags/${major}" --force
            echo "Moved ${major} to ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          fi
