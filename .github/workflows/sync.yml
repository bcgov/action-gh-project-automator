name: Sync

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:
    inputs:
      catch_up:
        description: 'Catch up: add all missing open items'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Triggers
    if: github.event_name == 'pull_request' && (! github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        uses: bcgov/actions/diff-triggers@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          triggers: |
            .
            !*.md

  tests:
    name: Unit Tests
    needs: check
    if: >-
      ${{ !cancelled() && !failure() && (! github.event.pull_request.draft)
      && (github.event_name != 'pull_request' || needs.check.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run Tests
        shell: bash
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

  sync:
    name: Action
    needs: tests
    if: ${{ !cancelled() && !failure() && (! github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      DRY_RUN: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build action bundle
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Run Sync Engine
        uses: ./.github/actions/sync-engine
        with:
          # Catch up runs the backfill path over all open items
          backfill: ${{ inputs.catch_up && 'all' || '' }}
          verbose: 'true'
          github_token: ${{ secrets.PROJECT_SYNC_TOKEN }}

  trivy:
    name: Trivy Security Scan
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: .trivycache
          key: ${{ runner.os }}-trivy-v0.36.0-cache-v1
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          trivyignores: ".github/.trivyignore"
          cache-dir: .trivycache
          scan-ref: "."
          skip-dirs: "**/node_modules,**/coverage,**/dist,.git"

      - name: Upload Trivy scan results to GitHub Security tab (PR)
        if: always() && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  results:
    name: Sync Results
    needs: [check, tests, sync, trivy]
    if: always() && (! github.event.pull_request.draft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request' && contains(needs.*.result, 'failure')

      - name: Notify on Failure
        if: github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
        uses: bcgov/actions/workflow-notifier@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "fix: failure in ${{ github.workflow }}"
          labels: "bug"
          notify_codeowners: "true"

      - uses: bcgov/actions/workflow-results@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          needs: ${{ toJson(needs) }}
