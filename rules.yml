# Project Board Sync Configuration
# User-facing configuration template - users provide their own rules.yml in their repositories.
# This file serves as an example template showing available configuration options.
# For developer documentation and feature specifications, see the specs/ directory.
# Changes here will be applied on the next sync run.

project:
  url: "https://github.com/orgs/bcgov/projects/16" # Project URL for dynamic resolution
  organization: "bcgov" # Default organization for repository-scoped rules
  allowedOrgs: # Organizations to search for user-scoped items (author/assignee)
    - bcgov
    - bcgov-c

automation:
  # Rules that follow users across all repositories
  user_scope:
    monitored_users:
      - DerekRoberts
    rules:
      # Board addition rules
      board_items:
        - name: "authored_pull_requests"
          description: "Add pull requests authored by any monitored user"
          trigger:
            type: "PullRequest"
            condition: "monitored.users.includes(item.author)"
          action: "add_to_board"
          skip_if: "item.inProject"

        - name: "assigned_pull_requests"
          description: "Add pull requests assigned to any monitored user"
          trigger:
            type: "PullRequest"
            condition: "item.assignees.some(assignee => monitored.users.includes(assignee))"
          action: "add_to_board"
          skip_if: "item.inProject"

        - name: "assigned_issues"
          description: "Add issues assigned to any monitored user"
          trigger:
            type: "Issue"
            condition: "item.assignees.some(assignee => monitored.users.includes(assignee))"
          action: "add_to_board"
          skip_if: "item.inProject"

      # Assignee rules
      assignees:
        - name: "assign_authored_prs"
          description: "Add PR author as assignee"
          trigger:
            type: "PullRequest"
            condition: "monitored.users.includes(item.author)"
          action: "add_assignee"
          value: "item.author"
          skip_if: "item.assignees.includes(item.author)"

  # Rules limited to specific repositories
  repository_scope:
    # organization: "bcgov"  # Deprecated - now uses fully qualified repo names
    repositories:
      - bcgov/actions
      - bcgov/action-builder-ghcr
      - bcgov/action-crunchy
      - bcgov/action-deployer-openshift
      - bcgov/action-gh-project-automator
      - bcgov/copilot-instructions
      - bcgov/nr-nerds
      - bcgov/quickstart-openshift
      - bcgov/quickstart-openshift-backends
      - bcgov/quickstart-openshift-helpers

    rules:
      # Board addition rules
      board_items:
        - name: "repository_pull_requests"
          description: "Add pull requests from monitored repositories"
          trigger:
            type: "PullRequest"
            condition: "monitored.repos.includes(item.repository)"
          action: "add_to_board"
          skip_if: "item.inProject"

        - name: "repository_issues"
          description: "Add issues from monitored repositories"
          trigger:
            type: "Issue"
            condition: "monitored.repos.includes(item.repository)"
          action: "add_to_board"
          skip_if: "item.inProject"

      # Column moves are set in board_columns below

      # Sprint assignment rules
      # Note: Edge cases are handled automatically:
      # - Items completed during sprint gaps are assigned to next available sprint
      # - Both active and completed iterations are queried from GitHub API
      # - Graceful handling when no future sprint exists
      sprints:
        - name: "active_sprint_assignment"
          description: "Assign current sprint in Next/Active columns"
          trigger:
            type: ["PullRequest", "Issue"]
            condition: "item.column === 'Next' || item.column === 'Active'"
          action: "set_sprint"
          value: "current"
          skip_if: "item.sprint === 'current'"

        - name: "waiting_sprint_assignment"
          description: "Assign current sprint to items in Waiting column (only if no sprint set)"
          trigger:
            type: ["PullRequest", "Issue"]
            condition: "item.column === 'Waiting'"
          action: "set_sprint"
          value: "current"
          skip_if: "item.sprint != null"

        - name: "done_sprint_assignment"
          description: "Assign sprint in Done column"
          trigger:
            type: ["PullRequest", "Issue"]
            condition: "item.column === 'Done'"
          action: "set_sprint"
          value: "current"
          skip_if: "item.sprint === 'current'"

        - name: "remove_sprint_inactive_columns"
          description: "Remove sprint from items in inactive columns (New, Parked, Backlog)"
          trigger:
            type: ["PullRequest", "Issue"]
            condition: "item.column === 'New' || item.column === 'Parked' || item.column === 'Backlog'"
          action: "remove_sprint"
          skip_if: "item.sprint == null"

# Exclusion rules to filter out automated noise by title
exclusions:
  exact_titles:
    - "Dependency Dashboard"
  title_substrings:
    - "ZAP Security Report"
    # Default issue_title of zaproxy/action-full-scan, action-baseline and action-api-scan
    - "ZAP Full Scan Report"
    - "ZAP Scan Baseline Report"
    - "ZAP API Scan Report"

technical:
  batch_size: 10
  batch_delay_seconds: 1
  update_window_hours: 2
  existing_items:
    sweep_enabled: false
    min_rate_limit_remaining: 250
  optimization:
    skip_unchanged: true
    dedup_by_id: true

# Board column moves, applied by src/utils/column-assignment.js
# "keep" leaves the item in its current column.
board_columns:
  # Items in these columns are never moved, even when closed or merged
  locked:
    - Waiting
    - Parked
  pull_request:
    ready: Active # Open and ready for review
    draft: keep # A draft PR is the lock on its issue, so it stays put
    draft_no_status: New # A new draft with no Status yet
    merged: Done
    closed: Done # Closed without merging
  linked_issue: # Issues the PR closes, following the PR's state
    ready: Active
    draft: keep
    merged: Done
    closed: Next # PR closed without merging returns the issue to Next
  issue:
    no_status: New
    closed: Done
