# Project Board Sync Configuration
# User-facing configuration template - users provide their own rules.yml in their repositories.
# This file serves as an example template showing available configuration options.
# For developer documentation and feature specifications, see the specs/ directory.
# Changes here will be applied on the next sync run.

# Every key the engine reads is required here; there are no built-in defaults.
project:
  url: "https://github.com/orgs/bcgov/projects/16" # Project board
  organization: "bcgov" # Default organization for unqualified repository names
  allowedOrgs: # Organizations to search for user-scoped items (author/assignee)
    - bcgov
    - bcgov-c
  fields: # Project field names
    status: "Status"
    sprint: "Sprint"

automation:
  # Rules that follow users across all repositories
  user_scope:
    monitored_users:
      - DerekRoberts
    rules:
      # Board addition rules
      board_items:
        - name: "authored_pull_requests"
          description: "Add pull requests authored by any monitored user"
          trigger:
            type: "PullRequest"
            condition: "monitored.users.includes(item.author)"
          action: "add_to_board"
          skip_if: "item.inProject"

        - name: "assigned_pull_requests"
          description: "Add pull requests assigned to any monitored user"
          trigger:
            type: "PullRequest"
            condition: "item.assignees.some(assignee => monitored.users.includes(assignee))"
          action: "add_to_board"
          skip_if: "item.inProject"

        - name: "assigned_issues"
          description: "Add issues assigned to any monitored user"
          trigger:
            type: "Issue"
            condition: "item.assignees.some(assignee => monitored.users.includes(assignee))"
          action: "add_to_board"
          skip_if: "item.inProject"

      # Assignee rules
      assignees:
        - name: "assign_authored_prs"
          description: "Add PR author as assignee"
          trigger:
            type: "PullRequest"
            condition: "monitored.users.includes(item.author)"
          action: "add_assignee"
          value: "item.author"
          skip_if: "item.assignees.includes(item.author)"

  # Rules limited to specific repositories
  repository_scope:
    repositories:
      # Core
      - bcgov/actions
      - bcgov/actions-openshift
      - bcgov/devops-scripts
      - bcgov/quickstart-openshift
      - bcgov/quickstart-openshift-modules
      - bcgov/renovate-config
      # FSD
      - bcgov/action-repo-reporter
      - bcgov/nr-seedtransfer-map
      - bcgov/project-automator
      # Maint
      - bcgov/action-gwa-publish
      - bcgov/nr-forest-client-commons
      - bcgov/nr-hydrometric-rating-curve
      - bcgov/nr-old-growth
      - bcgov/nr-results-exam
      - bcgov/pubcode
      # The maintainer's work (brain)
      - DerekRoberts/brain

    rules:
      # Board addition rules
      board_items:
        - name: "repository_pull_requests"
          description: "Add pull requests from monitored repositories"
          trigger:
            type: "PullRequest"
            condition: "monitored.repos.includes(item.repository)"
          action: "add_to_board"
          skip_if: "item.inProject"

        - name: "repository_issues"
          description: "Add issues from monitored repositories"
          trigger:
            type: "Issue"
            condition: "monitored.repos.includes(item.repository)"
          action: "add_to_board"
          skip_if: "item.inProject"

      # Column moves are set in board_columns below

# Exclusion rules to filter out automated noise by title or label
exclusions:
  exact_titles:
    - "Dependency Dashboard"
  title_substrings:
    - "ZAP Security Report"
    # Default issue_title of zaproxy/action-full-scan, action-baseline and action-api-scan
    - "ZAP Full Scan Report"
    - "ZAP Scan Baseline Report"
    - "ZAP API Scan Report"
  title_prefixes:
    # Custom issue_title in quickstart-openshift-modules pentests.yml ("ZAP: <name>")
    - "ZAP: "
  exclude_labels: [] # Label names, case-insensitive; an item with any of them is skipped

technical:
  update_window_hours: 2 # Search window when there's no watermark from a previous run

# Sprint field, applied by src/utils/sprint.js after the column is set
sprints:
  assign_current: # Set the current sprint
    - Active
    - Next
    - Done
  assign_current_if_empty: # Set the current sprint only when the item has none
    - Waiting
  clear: # Remove the sprint
    - New
    - Parked
    - Backlog

# Board column moves, applied by src/utils/column-assignment.js
# "keep" leaves the item in its current column.
# Closed and merged items aren't moved here: GitHub's built-in project workflows move them to Done.
board_columns:
  # Items in these columns are never moved
  locked:
    - Waiting
    - Parked
  pull_request:
    ready: Active # Open and ready for review
    draft: keep # A draft PR is the lock on its issue, so it stays put
    draft_no_status: New # A new draft with no Status yet
  linked_issue: # Issues the PR closes, following the PR's state
    ready: Active
    draft: keep
    closed: Next # PR closed without merging returns the issue to Next
  issue:
    no_status: New
